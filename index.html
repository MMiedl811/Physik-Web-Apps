<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08111f">
    <title>Physik Interaktiv – Matthias Miedl</title>
    <style>
        :root {
            --bg: #08111f;
            --panel: rgba(16, 31, 53, .76);
            --text: #f5f7fb;
            --muted: #9eacc2;
            --cyan: #5ee7f7;
            --violet: #a78bfa;
            --line: rgba(255,255,255,.12);
            --shadow: 0 24px 70px rgba(0,0,0,.28);
            --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh; margin: 0; padding: 28px;
            color: var(--text); font-family: var(--font);
            background: radial-gradient(circle at 15% 5%, #173763 0, transparent 34%),
                        radial-gradient(circle at 90% 15%, #3d226d 0, transparent 30%), var(--bg);
        }
        body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22;
            background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 44px 44px; mask-image: linear-gradient(to bottom, black, transparent 80%); }
        .shell { width: min(1120px, 100%); margin: auto; position: relative; }
        header { padding: clamp(48px, 10vw, 108px) 0 54px; max-width: 760px; }
        .eyebrow { color: var(--cyan); font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
        h1 { font-size: clamp(3.2rem, 9vw, 7.6rem); line-height: .88; letter-spacing: -.08em; margin: 18px 0 26px; }
        h1 span { color: var(--cyan); text-shadow: 0 0 34px rgba(94,231,247,.28); }
        .intro { color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.3rem); line-height: 1.55; margin: 0; max-width: 600px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 16px; }
        .card { position: relative; overflow: hidden; min-height: 205px; padding: 25px; border: 1px solid var(--line); border-radius: 24px; color: var(--text); text-decoration: none;
            background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.035)), var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(14px); transition: transform .25s ease, border-color .25s ease, background .25s ease; }
        .card::after { content: ""; position: absolute; width: 120px; height: 120px; right: -45px; bottom: -55px; border-radius: 50%; background: var(--violet); filter: blur(32px); opacity: .28; transition: opacity .25s ease; }
        .card:hover { transform: translateY(-7px) rotate(-.4deg); border-color: var(--cyan); background: linear-gradient(145deg, rgba(94,231,247,.18), rgba(255,255,255,.04)), var(--panel); }
        .card:hover::after { opacity: .6; }
        .card-icon { font-size: 2.4rem; margin-bottom: 44px; }
        .card-title { position: relative; z-index: 1; max-width: 210px; font-size: 1.14rem; font-weight: 750; line-height: 1.25; }
        .arrow { position: absolute; right: 23px; top: 23px; color: var(--cyan); font-size: 1.45rem; }
        footer { padding: 44px 0 18px; color: #71809a; font-size: .85rem; }
        @media (max-width: 560px) { body { padding: 18px; } header { padding-top: 55px; } .card { min-height: 170px; } }
        @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
    </style>
</head>
<body>
    <div class="shell">
        <header>
            <div class="eyebrow">Physik · interaktiv · direkt</div>
            <h1>Physik<br><span>zum Abheben.</span></h1>
            <p class="intro">Digitale Lernumgebungen für das iPad — zum Erkunden, Ausprobieren und Durchblicken.</p>
        </header>
        <main class="grid" id="app-grid" aria-label="Physik-Anwendungen"></main>
        <footer>&copy; <span id="year"></span> · mmiedl811.github.io</footer>
    </div>
    <script>
        const myApps = [
            { title: "Klasse 8 Quiz zu Geschwindigkeit", path: "quiz", icon: "🧩" },
            { title: "Geschwindigkeitsänderung", path: "v_aenderung", icon: "🏒" },
            { title: "Energiestufenmodell", path: "energiestufenmodell", icon: "⚛️" },
            { title: "Richtungsänderung nach Stoß", path: "impuls", icon: "↗️" },
            { title: "Größe Impuls", path: "impulsdiagramm", icon: "💥" },
            { title: "Bewegungsdiagramme", path: "diagramme", icon: "📈" },
            { title: "Waagrechter Abwurf auf Insel", path: "waagrechter Wurf", icon: "🏝️" },
            { title: "Schwingungen", path: "schwingungen", icon: "🪶" }
        ];
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            const grid = document.getElementById('app-grid');
            myApps.forEach(app => {
                const card = document.createElement('a');
                card.href = app.path + "/";
                card.className = 'card';
                card.innerHTML = `<span class="arrow" aria-hidden="true">↗</span><div class="card-icon" aria-hidden="true">${app.icon}</div><div class="card-title">${app.title}</div>`;
                grid.appendChild(card);
            });
        });
    </script>
</body>
</html>
