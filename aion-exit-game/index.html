<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#224b42" />
    <title>AION – Das letzte Archiv</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="../index.html" aria-label="Zur App-Übersicht">⌂</a>
      <div class="brand">AION <small>DAS LETZTE ARCHIV</small></div>
      <div id="progress" aria-live="polite">0 / 5 Kerne</div>
      <button
        id="sound"
        aria-pressed="false"
        aria-label="Spieltöne einschalten"
      >
        ♪ AUS</button
      ><button id="journal">Journal</button><button id="bag">Rucksack</button
      ><button id="menu" aria-label="Spielmenü">☰</button>
    </header>
    <main>
      <section class="world">
        <div class="location">
          <span id="location">ASTER-CAMPUS</span><span id="clock">00:00</span>
        </div>
        <canvas
          id="gameCanvas"
          width="480"
          height="352"
          tabindex="0"
          aria-label="Pixel-Spielwelt. Pfeiltasten oder WASD bewegen, E oder Enter untersuchen. Alternativ die Objektliste verwenden."
        ></canvas>
        <div id="toast" role="status"></div>
        <div class="walk-help">
          Pfeiltasten / WASD · E untersuchen · Ziel antippen
        </div>
      </section>
      <aside class="sidebar">
        <div class="label">DEINE MISSION</div>
        <h1 id="objective">Das letzte Archiv</h1>
        <p id="missionText">Finde heraus, warum die Station schweigt.</p>
        <div id="objects" class="objects"></div>
        <div class="radio">
          <span class="portrait" aria-hidden="true">A</span>
          <div>
            <b>AION · Notfallkanal</b>
            <p id="radioText">Verbindung wird hergestellt …</p>
          </div>
        </div>
        <div id="touchPad">
          <button data-dir="up" aria-label="Nach oben">▲</button
          ><button data-dir="left" aria-label="Nach links">◀</button
          ><button id="interact" aria-label="Untersuchen">A</button
          ><button data-dir="right" aria-label="Nach rechts">▶</button
          ><button data-dir="down" aria-label="Nach unten">▼</button>
        </div>
        <p id="saveStatus" class="small">Spielstand bleibt auf diesem Gerät.</p>
      </aside>
    </main>
    <dialog id="modal" aria-labelledby="dialogTitle">
      <div class="dialog-head">
        <div>
          <span class="label" id="dialogLabel">AION · FUNKVERBINDUNG</span>
          <h2 id="dialogTitle"></h2>
        </div>
        <button id="close" aria-label="Schließen">×</button>
      </div>
      <div id="dialogBody"></div>
    </dialog>
    <script src="data.js"></script>
    <script src="game.js"></script>
  </body>
</html>
